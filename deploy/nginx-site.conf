# LaundryGo - nginx site config (host install, no Docker)
# Installed by deploy/setup-ec2.sh to /etc/nginx/conf.d/laundrygo.conf

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/laundrygo;
    index index.html;

    server_tokens off;

    # Basic security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Compression (saves outbound data transfer, which counts toward the free allowance)
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    # Hashed build assets: cache for a year
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Never cache the HTML shell so new deployments show up immediately
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Single-page-app fallback: /track, /book, /auth, ... all serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Block hidden files (but allow Let's Encrypt challenges)
    location ~ /\.(?!well-known) {
        deny all;
    }
}
